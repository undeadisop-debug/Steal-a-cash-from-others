<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Steal CASH From Others</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0c0f;--bg2:#111318;--card:#15181e;--line:#23272f;--line2:#2f3540;--fg:#f2f3f5;--muted:#9aa1ad;--dim:#5f6775;--accent:#22c55e;--accent-ink:#052e16;--yellow:#facc15;--blurple:#5865f2;--r:14px}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.6 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%}
h1,h2,h3{font-family:"Space Grotesk",Inter,sans-serif;margin:0;letter-spacing:-.02em;font-weight:700}
.wrap{max-width:1080px;margin:0 auto;padding:0 22px}

/* header + menu */
header{position:sticky;top:0;z-index:10;background:rgba(11,12,15,.85);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
header .wrap{display:flex;align-items:center;gap:16px;height:64px}
.logo{display:flex;align-items:center;gap:10px;font-family:"Space Grotesk";font-weight:700;font-size:17px}
.logo i{width:32px;height:32px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-style:normal;font-weight:800;overflow:hidden}
.logo i img{width:100%;height:100%;object-fit:cover}
nav{margin-left:auto;display:flex;gap:2px}
nav a{padding:8px 13px;border-radius:8px;font-size:14.5px;font-weight:500;color:var(--muted)}
nav a:hover,nav a.on{color:var(--fg);background:var(--bg2)}
.burger{display:none;margin-left:auto;width:42px;height:42px;border-radius:10px;border:1px solid var(--line2);background:var(--bg2);color:var(--fg);font-size:18px;cursor:pointer}
.menu{display:none;position:fixed;inset:64px 0 0 0;background:rgba(11,12,15,.97);z-index:9;padding:18px 22px;overflow:auto}
.menu.open{display:block}
.menu a{display:flex;align-items:center;gap:14px;padding:16px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);margin-bottom:10px;font-weight:600;font-size:17px}
.menu a small{display:block;font-weight:400;color:var(--muted);font-size:13.5px}
.menu a .ic{width:40px;height:40px;border-radius:10px;background:var(--bg2);display:grid;place-items:center;font-size:18px;flex-shrink:0}
.menu .sep{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);margin:20px 0 10px;font-weight:600}

.marquee{background:var(--yellow);color:#1a1600;overflow:hidden;white-space:nowrap;font-weight:600;font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;padding:7px 0}
.marquee div{display:inline-block;animation:mq 30s linear infinite}
@keyframes mq{to{transform:translateX(-50%)}}

.page{display:none;animation:in .3s ease}.page.on{display:block}
@keyframes in{from{opacity:0;transform:translateY(6px)}}

.hero{padding:96px 0 64px;border-bottom:1px solid var(--line);background:radial-gradient(700px 320px at 20% 0%,color-mix(in srgb,var(--accent) 10%,transparent),transparent 70%)}
.hero .wrap{display:grid;grid-template-columns:1.15fr .85fr;gap:48px;align-items:center}
.pill{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,transparent);border:1px solid color-mix(in srgb,var(--accent) 30%,transparent);padding:5px 12px;border-radius:999px;margin-bottom:22px}
.pill:before{content:'';width:7px;height:7px;border-radius:50%;background:var(--accent)}
.hero h1{font-size:clamp(42px,6.5vw,72px);line-height:1.02}
.hero h1 em{font-style:normal;color:var(--accent)}
.hero p{font-size:18px;color:var(--muted);max-width:540px;margin:22px 0 30px}
.btn{display:inline-flex;align-items:center;gap:8px;font-weight:600;padding:12px 20px;border-radius:10px;background:var(--bg2);border:1px solid var(--line2);margin:0 10px 10px 0;transition:.15s;font-size:15px}
.btn:hover{border-color:var(--dim);background:var(--card);transform:translateY(-1px)}
.btn.g{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.g:hover{filter:brightness(1.1)}
.btn.d{background:var(--blurple);border-color:var(--blurple);color:#fff}
.btn.d:hover{filter:brightness(1.1)}
.meta{display:flex;gap:36px;flex-wrap:wrap;margin-top:36px;font-size:13px;color:var(--muted)}
.meta b{display:block;color:var(--fg);font-family:"Space Grotesk";font-size:26px;letter-spacing:-.02em}

.gamecard{background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden}
.gamecard .art{aspect-ratio:16/9;background:linear-gradient(160deg,color-mix(in srgb,var(--accent) 45%,#000),color-mix(in srgb,var(--accent) 15%,#000));position:relative;display:grid;place-items:center;overflow:hidden}
.gamecard .art img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.gamecard .art span{font-family:"Space Grotesk";font-weight:700;font-size:92px;color:var(--accent);letter-spacing:-.05em}
.gamecard .body{padding:22px}
.gamecard .body small{color:var(--muted);font-size:13px;font-weight:500}
.gamecard h3{font-size:20px;margin:4px 0 8px}
.gamecard p{color:var(--muted);margin:0 0 18px;font-size:15px}

section{padding:72px 0;border-bottom:1px solid var(--line)}
section h2{font-size:clamp(28px,4vw,40px);margin-bottom:10px}
section h2 small{display:block;font:600 12.5px Inter;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin-bottom:10px}
.lead{color:var(--muted);font-size:17px;max-width:600px;margin:0 0 28px}

.alert{display:flex;gap:18px;align-items:flex-start;background:color-mix(in srgb,var(--yellow) 7%,transparent);border:1px solid color-mix(in srgb,var(--yellow) 35%,transparent);border-radius:var(--r);padding:22px 24px}
.alert .ic{width:40px;height:40px;border-radius:10px;background:var(--yellow);color:#1a1600;display:grid;place-items:center;font-weight:800;font-size:22px;flex-shrink:0}
.alert h3{font-size:18px;margin-bottom:6px}
.alert p{margin:0;color:var(--muted)}
.alert a{color:var(--fg);font-weight:600;border-bottom:1px solid var(--yellow)}

.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:22px;display:block;position:relative;transition:.15s}
a.card:hover{border-color:var(--accent);transform:translateY(-2px)}
.card .ic{width:44px;height:44px;border-radius:11px;background:var(--bg2);display:grid;place-items:center;font-size:20px;margin-bottom:14px;overflow:hidden}
.card .ic img{width:100%;height:100%;object-fit:cover}
.card b{font-family:"Space Grotesk";font-size:17px;display:block;margin-bottom:4px}
.card span{color:var(--muted);font-size:14px;word-break:break-word}
a.card:after{content:'↗';position:absolute;right:18px;top:16px;color:var(--dim)}
a.card:hover:after{color:var(--accent)}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.gallery figure{margin:0;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--card)}
.gallery img{width:100%;aspect-ratio:16/10;object-fit:cover}
.gallery figcaption{padding:10px 14px;font-size:14px;color:var(--muted)}

.tier{margin-bottom:38px}
.tier h3{font-size:14px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:12px;margin-bottom:14px}
.tier h3:after{content:'';flex:1;height:1px;background:var(--line)}
.team{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.mem{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;gap:14px;align-items:center;transition:.15s}
.mem:hover{border-color:var(--c)}
.mem .av{width:48px;height:48px;border-radius:12px;flex-shrink:0;display:grid;place-items:center;font-family:"Space Grotesk";font-weight:700;font-size:19px;background:var(--c);color:#0b0c0f;overflow:hidden}
.mem .av img{width:100%;height:100%;object-fit:cover}
.mem b{display:block;font-size:16px}
.mem span{display:inline-block;font-size:12px;font-weight:600;color:var(--c);margin-top:3px}
.mem small{display:block;color:var(--muted);margin-top:4px;font-size:13px}
.tier.top .team{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.tier.top .mem{padding:24px}.tier.top .mem .av{width:64px;height:64px;font-size:26px;border-radius:16px}
.none{color:var(--dim);font-size:15px;border:1px dashed var(--line2);border-radius:var(--r);padding:16px 18px;margin:0}

.rules{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px;counter-reset:r}
.rules li{counter-increment:r;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px 18px 18px 58px;position:relative;color:var(--muted)}
.rules li:before{content:counter(r,decimal-leading-zero);position:absolute;left:18px;top:17px;font-family:"Space Grotesk";font-weight:700;color:var(--accent)}
footer{padding:32px 0;font-size:14px;color:var(--muted)}
footer .wrap{display:flex;gap:18px;flex-wrap:wrap;align-items:center}
footer a:hover{color:var(--fg)}
footer .r{margin-left:auto}
@media(max-width:820px){.hero .wrap{grid-template-columns:1fr}.hero{padding:56px 0 40px}nav,header .btn{display:none}.burger{display:block}section{padding:52px 0}.tier.top .team{grid-template-columns:1fr}}

/* ---- animations ---- */
.rv{opacity:0;transform:translateY(22px);transition:opacity .6s ease,transform .6s cubic-bezier(.2,.7,.2,1)}
.rv.in{opacity:1;transform:none}
.hero .pill,.hero h1,.hero p,.hero .btn,.hero .meta{animation:up .7s cubic-bezier(.2,.7,.2,1) both}
.hero h1{animation-delay:.08s}.hero p{animation-delay:.18s}.hero .btn{animation-delay:.28s}.hero .btn+.btn{animation-delay:.34s}.hero .btn+.btn+.btn{animation-delay:.4s}.hero .meta{animation-delay:.5s}
@keyframes up{from{opacity:0;transform:translateY(26px)}}
.gamecard{animation:pop .8s .25s cubic-bezier(.2,.7,.2,1) both;transition:transform .15s ease;will-change:transform}
@keyframes pop{from{opacity:0;transform:translateY(30px) scale(.96)}}
.art .bill{position:absolute;width:88px;height:44px;border-radius:7px;background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 75%,#000),var(--accent));box-shadow:inset 0 0 0 2px rgba(255,255,255,.25),0 10px 24px rgba(0,0,0,.4);display:grid;place-items:center;font:700 18px "Space Grotesk";color:#052e16;animation:drift 7s ease-in-out infinite;opacity:.9}
@keyframes drift{0%,100%{transform:translate(0,0) rotate(var(--r))}50%{transform:translate(0,-18px) rotate(calc(var(--r) + 6deg))}}
.art span{animation:beat 3s ease-in-out infinite}
@keyframes beat{50%{transform:scale(1.08)}}
.btn{position:relative;overflow:hidden}
.btn:after{content:'';position:absolute;top:0;left:-80%;width:50%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.35),transparent);transform:skewX(-20deg);transition:left .5s ease}
.btn:hover:after{left:130%}
.pill:before{animation:blink 1.6s infinite}
@keyframes blink{50%{box-shadow:0 0 0 6px color-mix(in srgb,var(--accent) 25%,transparent)}0%,100%{box-shadow:0 0 0 0 transparent}}
.mem,.card,.rules li,.gallery figure{transition:transform .2s ease,border-color .2s ease,box-shadow .2s ease}
.mem:hover,.rules li:hover,.gallery figure:hover{transform:translateY(-4px);box-shadow:0 16px 36px rgba(0,0,0,.35)}
.mem .av{transition:transform .3s ease}.mem:hover .av{transform:rotate(-6deg) scale(1.08)}
.alert .ic{animation:wiggle 2.4s ease-in-out infinite}
@keyframes wiggle{0%,80%,100%{transform:rotate(0)}85%{transform:rotate(-10deg)}90%{transform:rotate(10deg)}95%{transform:rotate(-6deg)}}
.menu a{animation:up .35s cubic-bezier(.2,.7,.2,1) both}
.menu a:nth-child(2){animation-delay:.04s}.menu a:nth-child(3){animation-delay:.08s}.menu a:nth-child(4){animation-delay:.12s}.menu a:nth-child(5){animation-delay:.16s}.menu a:nth-child(7){animation-delay:.2s}.menu a:nth-child(8){animation-delay:.24s}
nav a{position:relative}nav a:before{content:'';position:absolute;left:13px;right:13px;bottom:4px;height:2px;background:var(--accent);transform:scaleX(0);transition:transform .2s ease;transform-origin:left}
nav a.on:before,nav a:hover:before{transform:scaleX(1)}
.bar{position:fixed;top:0;left:0;height:3px;background:var(--accent);width:0;z-index:11;transition:width .1s linear}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}.rv{opacity:1;transform:none}}
</style>
</head>

<script>

// The menu (top bar on desktop, ☰ on phones). [label, link, description for the phone menu, icon]
// Links starting with # are pages of this site: #home #team #links #rules

// Link cards. [title, description, url, icon]  — icon can be an emoji or an image link

const RULES = [

/* ============================== STOP EDITING ============================== */

const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

if(SITE.logo)$("#logo").innerHTML=`<img src="${esc(SITE.logo)}" alt="">`;
$("#pill").textContent=SITE.pill; if(!SITE.pill)$("#pill").remove();
$("#h1").innerHTML=esc(SITE.title).replace(/\*(.+?)\*/,"<em>$1</em>").replace(/ (?=[^ ]+$)/,"<br>");
$("#tagline").textContent=SITE.tagline;
$("#marquee").textContent=(SITE.marquee+" ").repeat(6);
$$(".gm").forEach(a=>a.href=SITE.game); $$(".dc").forEach(a=>a.href=SITE.discord);
const days=Math.max(0,Math.floor((Date.now()-new Date(SITE.founded))/864e5));
$("#meta").innerHTML=[["days online",days],...SITE.stats].map(([l,v])=>`<div><b>${esc(v)}</b>${esc(l)}</div>`).join("");
$("#gameSub").textContent=SITE.gameSub; $("#gameTitle").textContent=SITE.gameTitle; $("#gameDesc").textContent=SITE.gameDesc;
if(SITE.gameImg)$("#art").innerHTML=`<img src="${esc(SITE.gameImg)}" alt="">`;
const n=SITE.notice;
if(!n.show)$("#noticeWrap").remove();else{$("#alertTitle").textContent=n.title;
  $("#alertText").innerHTML=esc(n.text).replace("{bugs}",`<a href="${chan(n.bugs)}" target="_blank" rel="noopener">${esc(n.bugs.name)}</a>`).replace("{tickets}",`<a href="${chan(n.tickets)}" target="_blank" rel="noopener">${esc(n.tickets.name)}</a>`)}
const card=([t,d,u,i])=>`<a class="card" href="${esc(u)}" target="_blank" rel="noopener"><div class="ic">${icon(i)}</div><b>${esc(t)}</b><span>${esc(d)}</span></a>`;
$("#homeLinks").innerHTML=LINKS.map(card).join("");
$("#allLinks").innerHTML=LINKS.map(([t,d,u,i])=>card([t,u.replace(/^https?:\/\/(www\.)?/,""),u,i])).join("");
if(!GALLERY.length)$("#galleryWrap").remove();else $("#gallery").innerHTML=GALLERY.map(([s,c])=>`<figure><img src="${esc(s)}" alt="${esc(c)}">${c?`<figcaption>${esc(c)}</figcaption>`:""}</figure>`).join("");
for(const k of["team","links","rules"]){$("#"+k+"H").textContent=SITE.headings[k][0];$("#"+k+"Lead").textContent=SITE.headings[k][1]}
$("#teamList").innerHTML=TEAM.map(g=>`<div class="tier ${g.big?"top":""}"><h3>${esc(g.group)}</h3>`+(g.members.length
  ?`<div class="team">${g.members.map(m=>`<div class="mem" style="--c:${esc(g.color)}"><div class="av">${m.avatar?`<img src="${esc(m.avatar)}" alt="">`:esc((m.name||"?")[0].toUpperCase())}</div><div><b>${esc(m.name)}</b><span>${esc(m.role)}</span>${m.note?`<small>${esc(m.note)}</small>`:""}</div></div>`).join("")}</div>`
  :`<p class="none">${esc(EMPTY_GROUP)}</p>`)+`</div>`).join("");
$("#ruleList").innerHTML=RULES.map(r=>`<li>${esc(r)}</li>`).join("");
$("#footer").textContent=SITE.footer;

/* menu */
const ext=u=>!u.startsWith("#");
$("#nav").innerHTML=MENU.filter(m=>!ext(m[1])).map(([l,u])=>`<a href="${esc(u)}" data-p="${u.slice(1)}">${esc(l)}</a>`).join("");
$("#menu").innerHTML=`<div class="sep">Pages</div>`+MENU.filter(m=>!ext(m[1])).map(([l,u,d,i])=>`<a href="${esc(u)}"><span class="ic">${icon(i)}</span><span>${esc(l)}<small>${esc(d)}</small></span></a>`).join("")
  +(MENU.some(m=>ext(m[1]))?`<div class="sep">Elsewhere</div>`+MENU.filter(m=>ext(m[1])).map(([l,u,d,i])=>`<a href="${esc(u)}" target="_blank" rel="noopener"><span class="ic">${icon(i)}</span><span>${esc(l)} ↗<small>${esc(d)}</small></span></a>`).join(""):"");
$("#burger").onclick=()=>$("#menu").classList.toggle("open");
$("#menu").onclick=()=>$("#menu").classList.remove("open");

/* pages */
const PAGES=["home","team","links","rules"];
function show(){const p=(location.hash||"#home").slice(1),pg=PAGES.includes(p)?p:"home";
  $$(".page").forEach(x=>x.classList.toggle("on",x.id==="p-"+pg));
  $$("[data-p]").forEach(a=>a.classList.toggle("on",a.dataset.p===pg));
  $("#menu").classList.remove("open");scrollTo({top:0})}
addEventListener("hashchange",show);show();

/* ---- animations ---- */
const reduced=matchMedia("(prefers-reduced-motion: reduce)").matches;
if(!reduced){
  const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target)}}),{threshold:.12});
  const reveal=()=>$$(".page.on .card,.page.on .mem,.page.on .rules li,.page.on .gallery figure,.page.on .alert,.page.on h2").forEach((el,i)=>{if(el.classList.contains("rv"))return;el.classList.add("rv");el.style.transitionDelay=(i%8)*45+"ms";io.observe(el)});
  reveal();addEventListener("hashchange",()=>setTimeout(reveal,20));
  // count-up for the numeric stats
  $$("#meta b").forEach(b=>{const m=b.textContent.match(/^(\d[\d,]*)(.*)$/);if(!m)return;const end=+m[1].replace(/,/g,""),suf=m[2],t0=performance.now();
    (function tick(t){const k=Math.min(1,(t-t0)/1100),e=1-Math.pow(1-k,3);b.textContent=Math.round(end*e).toLocaleString()+suf;if(k<1)requestAnimationFrame(tick)})(t0)});
  // tilt the game card toward the pointer
  const gc=$(".gamecard");gc.addEventListener("pointermove",e=>{const r=gc.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;gc.style.transform=`perspective(900px) rotateY(${x*8}deg) rotateX(${-y*8}deg) translateY(-2px)`});
  gc.addEventListener("pointerleave",()=>gc.style.transform="");
  // scroll progress bar
  addEventListener("scroll",()=>{const h=document.documentElement;$("#bar").style.width=(h.scrollTop/(h.scrollHeight-h.innerHeight||1)*100)+"%"},{passive:true});
}
</script>
</body>
</html>
